services:
  - type: web
    name: ulysses-library-pins
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: library-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        value: JaniceJiu
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_LEGACY_FEATURES
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
