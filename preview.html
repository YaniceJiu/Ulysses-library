<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Minecraft 建筑预览</title>
<style>
  body { margin:0; overflow:hidden; background:#0d1117; font-family:system-ui,sans-serif; }
  #info {
    position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(0,0,0,.65); color:#e6edf3; padding:10px 14px; border-radius:8px;
    font-size:13px; line-height:1.6; pointer-events:none;
  }
  #info b { color:#7ee787; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#aaa; font-size:18px; z-index:5; background:#0d1117; }
</style>
</head>
<body>
<div id="loading">加载建筑数据中…</div>
<div id="info">
  🏗️ <b id="blockCount">0</b> 个方块<br>
  尺寸 <b id="size"></b>（格）<br>
  🖱️ 左键拖动旋转 · 滚轮缩放 · 右键平移
</div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="colors.js"></script>
<script>
async function main() {
  const res = await fetch('library_build.json');
  const data = await res.json();
  const blocks = data.blocks;
  const [sx, sy, sz] = data.size;

  document.getElementById('blockCount').textContent = blocks.length.toLocaleString();
  document.getElementById('size').textContent = `${sx} × ${sy} × ${sz}`;
  document.getElementById('loading').style.display = 'none';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);
  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 2000);
  const cx = sx/2, cy = sy/2, cz = sz/2;
  camera.position.set(cx + Math.max(sx,sz)*0.9, cy + Math.max(sy,20)*1.6, cz + Math.max(sx,sz)*0.9);
  camera.lookAt(cx, cy, cz);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(cx, cy, cz);
  controls.update();
  window.__cam = camera; window.__ctl = controls; window.__sz = data.size;

  // 环境光 + 方向光
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(sx*0.6, sy*2.5, sz*0.6);
  scene.add(sun);

  // 地面
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(Math.max(sx,sz)*1.6, Math.max(sx,sz)*1.6),
    new THREE.MeshStandardMaterial({color:0x2a3138})
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.set(cx, -0.01, cz);
  scene.add(ground);

  // 按方块类型分组，每个类型一个 InstancedMesh
  const byId = {};
  for (const b of blocks) {
    (byId[b.id] = byId[b.id] || []).push(b);
  }
  for (const [id, list] of Object.entries(byId)) {
    const color = (BLOCK_COLORS[id] || [150,150,150]).map(v=>v/255);
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color[0], color[1], color[2]),
      roughness: 0.85, metalness: 0.05
    });
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    const s = new THREE.Vector3(1,1,1);
    const p = new THREE.Vector3();
    list.forEach((b, i) => {
      p.set(b.x + 0.5, b.y + 0.5, b.z + 0.5);
      m.compose(p, q, s);
      mesh.setMatrixAt(i, m);
    });
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}
main();
</script>
</body>
</html>
